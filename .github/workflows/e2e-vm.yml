---
# Test de bout en bout sur de VRAIES machines virtuelles (pas des conteneurs) :
# image cloud officielle + QEMU/KVM sur le runner, vrai ./install.sh, pare-feu
# et redémarrage de sshd compris, puis vérifications réelles et second passage
# idempotent. Détails : tests/e2e/scenario.sh
name: e2e-vm

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    name: vm (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        distro: [debian13, ubuntu2404]
    env:
      E2E_DISTRO: ${{ matrix.distro }}
      E2E_DIR: /tmp/lab-e2e
      E2E_ADRESSE: 127.0.0.2
    steps:
      - uses: actions/checkout@v5

      # Les runners Linux de GitHub exposent /dev/kvm, mais réservé à root
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Installer QEMU, cloud-init (seed), expect
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils expect dnsutils jq

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer Ansible (comme le ferait install.sh)
        run: python -m pip install -r requirements-dev.txt

      # Le port 22 de la VM est publié sur 127.0.0.2 : rien ne doit l'occuper
      - name: Libérer le port 22 local
        run: sudo systemctl stop ssh.socket ssh 2>/dev/null || true

      - name: Test de bout en bout
        run: tests/e2e/scenario.sh

      - name: Diagnostic (en cas d'échec)
        if: failure()
        run: tests/e2e/diagnostic.sh

      - name: Arrêter la VM
        if: always()
        run: |
          if [ -f "$E2E_DIR/qemu.pid" ]; then sudo kill "$(sudo cat "$E2E_DIR/qemu.pid")" || true; fi
