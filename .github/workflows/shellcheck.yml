# Vérifie que tous les scripts shell du dépôt passent shellcheck sans avertissement.
name: shellcheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (.sh + commandes de detection-pc sans extension)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' 'detection-pc/commandes/*' | xargs -0 shellcheck -S style
