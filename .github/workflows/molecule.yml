---
# Tests d'intégration : site.yml déployé dans un conteneur systemd par
# distribution, second passage idempotent (0 changed), puis vérifications
# (Grafana, DNS AdGuard, CrowdSec, sshd).
name: molecule

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  molecule:
    name: molecule (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            image: geerlingguy/docker-debian12-ansible:latest
          - distro: debian13
            image: geerlingguy/docker-debian13-ansible:latest
          - distro: ubuntu2404
            image: geerlingguy/docker-ubuntu2404-ansible:latest
          - distro: rocky9
            image: geerlingguy/docker-rockylinux9-ansible:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les outils
        run: python -m pip install -r requirements-dev.txt
      # Collections installées d'avance (Molecule les trouve alors déjà là) :
      # Galaxy renvoie parfois une réponse invalide passagère, d'où 3 essais
      - name: Installer les collections Ansible
        run: |
          for essai in 1 2 3; do
            ansible-galaxy collection install -r ansible/requirements.yml && break
            [ "$essai" = 3 ] && exit 1
            sleep $((essai * 10))
          done
      - name: molecule test
        working-directory: ansible
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_IMAGE: ${{ matrix.image }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test
