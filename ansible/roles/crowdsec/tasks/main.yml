---
# Installe CrowdSec et le bouncer pare-feu : paquets de la distribution quand
# elle les fournit (Debian, Ubuntu 24.04), sinon dépôt officiel CrowdSec.
- name: Installer CrowdSec (Debian, Ubuntu)
  ansible.builtin.include_tasks: installer_debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Installer CrowdSec (Fedora, RHEL)
  ansible.builtin.include_tasks: installer_redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Créer le dossier d'acquisition
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configurer l'acquisition des logs SSH (journald)
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/ssh-journald.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      source: journalctl
      journalctl_filter:
        - "_SYSTEMD_UNIT={{ ssh_service }}.service"
      labels:
        type: syslog
  notify: Redémarrer CrowdSec

# Correctif OpenSSH >= 9.8 (Debian 13, Fedora 41+...) : le processus SSH est
# renommé « sshd-session », ce que le parser CrowdSec ne reconnaît pas. On rétablit
# le nom « sshd » tôt dans l'étape s01 pour que la détection d'attaque SSH marche.
# Appliqué seulement si le binaire sshd-session existe (chemin Debian ou Red Hat).
- name: Détecter sshd-session (OpenSSH >= 9.8)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/openssh/sshd-session
    - /usr/libexec/openssh/sshd-session
  register: crowdsec_sshd_session

- name: Dossier des parsers locaux
  ansible.builtin.file:
    path: /etc/crowdsec/parsers/s01-parse
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "OpenSSH >= 9.8 : corriger la reconnaissance du parser SSH (sshd-session)"
  ansible.builtin.copy:
    dest: /etc/crowdsec/parsers/s01-parse/aaa-sshd-session-fix.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      filter: "evt.Parsed.program == 'sshd-session'"
      name: lab-dacs/sshd-session-rename
      description: "OpenSSH >= 9.8 renomme sshd en sshd-session ; on retablit le nom pour le parser SSH"
      statics:
        - parsed: program
          value: sshd
  when: crowdsec_sshd_session.results | selectattr('stat.exists') | list | length > 0
  notify: Redémarrer CrowdSec

- name: Activer et démarrer CrowdSec
  ansible.builtin.systemd:
    name: crowdsec
    enabled: true
    state: started

- name: Activer et démarrer le bouncer
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started
