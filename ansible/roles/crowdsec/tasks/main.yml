---
# Installe CrowdSec et le bouncer pare-feu : paquets de la distribution quand
# elle les fournit (Debian, Ubuntu 24.04), sinon dépôt officiel CrowdSec.
- name: Installer CrowdSec (Debian, Ubuntu)
  ansible.builtin.include_tasks: installer_debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Installer CrowdSec (Fedora, RHEL)
  ansible.builtin.include_tasks: installer_redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Créer le dossier d'acquisition
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configurer l'acquisition des logs SSH (journald)
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/ssh-journald.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      source: journalctl
      journalctl_filter:
        - "_SYSTEMD_UNIT={{ ssh_service }}.service"
      labels:
        type: syslog
  notify: Redémarrer CrowdSec

# Correctif OpenSSH >= 9.8 (Debian 13, Fedora 41+...) : le processus SSH est
# renommé « sshd-session », ce que le parser CrowdSec ne reconnaît pas. On rétablit
# le nom « sshd » tôt dans l'étape s01 pour que la détection d'attaque SSH marche.
# Appliqué seulement si le binaire sshd-session existe (chemin Debian ou Red Hat).
- name: Détecter sshd-session (OpenSSH >= 9.8)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/openssh/sshd-session
    - /usr/libexec/openssh/sshd-session
  register: crowdsec_sshd_session

- name: Dossier des parsers locaux
  ansible.builtin.file:
    path: /etc/crowdsec/parsers/s01-parse
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "OpenSSH >= 9.8 : corriger la reconnaissance du parser SSH (sshd-session)"
  ansible.builtin.copy:
    dest: /etc/crowdsec/parsers/s01-parse/aaa-sshd-session-fix.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      filter: "evt.Parsed.program == 'sshd-session'"
      name: lab-dacs/sshd-session-rename
      description: "OpenSSH >= 9.8 renomme sshd en sshd-session ; on retablit le nom pour le parser SSH"
      statics:
        - parsed: program
          value: sshd
  when: crowdsec_sshd_session.results | selectattr('stat.exists') | list | length > 0
  notify: Redémarrer CrowdSec

- name: Activer et démarrer CrowdSec
  ansible.builtin.systemd:
    name: crowdsec
    enabled: true
    state: started

# Paquets Debian/Ubuntu : quand l'API locale n'est pas prête à l'installation
# du bouncer, le paquet crée /var/lib/crowdsec/pending-registration et le service
# du bouncer refuse de démarrer tant que ce fichier existe (ConditionPathExists) :
# sans rien faire, le bouncer ne démarre jamais. On l'inscrit donc nous-mêmes :
# clé d'API créée par cscli, écrite dans sa configuration, marqueur supprimé.
- name: Repérer une inscription de bouncer en attente
  ansible.builtin.stat:
    path: /var/lib/crowdsec/pending-registration
  register: crowdsec_inscription

- name: Inscrire le bouncer auprès de l'API locale
  when: crowdsec_inscription.stat.exists
  block:
    # Une inscription partielle antérieure bloquerait « bouncers add »
    - name: Supprimer une éventuelle inscription incomplète
      ansible.builtin.command: cscli bouncers delete crowdsec-firewall-bouncer
      register: crowdsec_suppression
      changed_when: crowdsec_suppression.rc == 0
      failed_when: false

    - name: Créer la clé d'API du bouncer
      ansible.builtin.command: cscli bouncers add crowdsec-firewall-bouncer -o raw
      register: crowdsec_cle_bouncer
      changed_when: true
      no_log: true

    - name: Écrire la clé dans la configuration du bouncer
      ansible.builtin.lineinfile:
        path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
        regexp: '^api_key:'
        line: "api_key: {{ crowdsec_cle_bouncer.stdout | trim }}"
      no_log: true

    - name: Retirer le marqueur d'inscription en attente
      ansible.builtin.file:
        path: /var/lib/crowdsec/pending-registration
        state: absent

- name: Activer et démarrer le bouncer
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started

# Un bouncer qui plante juste après son démarrage (clé d'API absente, pare-feu
# inutilisable...) ne bloque plus rien, en silence : on vérifie qu'il tourne
# toujours quelques secondes plus tard, et on affiche son journal sinon.
- name: Vérifier que le bouncer reste actif
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
  register: crowdsec_bouncer_etat
  until: crowdsec_bouncer_etat.status.SubState == 'running'
  retries: 5
  delay: 3
  failed_when: false

- name: Lire le journal du bouncer
  ansible.builtin.command: journalctl -u crowdsec-firewall-bouncer -n 40 --no-pager
  register: crowdsec_bouncer_journal
  changed_when: false
  when: crowdsec_bouncer_etat.status.SubState != 'running'

- name: Le bouncer doit tourner
  ansible.builtin.fail:
    msg: "{{ ['crowdsec-firewall-bouncer ne tourne pas (' ~ crowdsec_bouncer_etat.status.SubState ~ ') :'] + crowdsec_bouncer_journal.stdout_lines }}"
  when: crowdsec_bouncer_etat.status.SubState != 'running'
