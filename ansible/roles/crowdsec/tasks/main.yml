---
# Installe CrowdSec (version Debian) et le bouncer pare-feu
- name: Installer CrowdSec et le firewall-bouncer
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer
    state: present
    update_cache: true

- name: Créer le dossier d'acquisition
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configurer l'acquisition des logs SSH (journald)
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/ssh-journald.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      source: journalctl
      journalctl_filter:
        - "_SYSTEMD_UNIT=ssh.service"
      labels:
        type: syslog
  notify: Redémarrer CrowdSec

# Correctif Debian 13 : le processus SSH est renomme "sshd-session",
# ce que le parser CrowdSec ne reconnait pas. On retablit le nom "sshd"
# tot dans l'etape s01 pour que la detection d'attaque SSH fonctionne.
# Conditionnel : ne s'applique que sur Debian 13 et superieur.
- name: "Debian 13 : corriger la reconnaissance du parser SSH (sshd-session)"
  ansible.builtin.copy:
    dest: /etc/crowdsec/parsers/s01-parse/aaa-sshd-session-fix.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      filter: "evt.Parsed.program == 'sshd-session'"
      name: debian13/sshd-session-rename
      description: "Debian 13 renomme sshd en sshd-session ; on retablit le nom pour le parser SSH"
      statics:
        - parsed: program
          value: sshd
  when:
    - ansible_distribution == "Debian"
    - ansible_distribution_major_version | int >= 13
  notify: Redémarrer CrowdSec

- name: Activer et démarrer CrowdSec
  ansible.builtin.systemd:
    name: crowdsec
    enabled: true
    state: started

- name: Activer et démarrer le bouncer
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started
