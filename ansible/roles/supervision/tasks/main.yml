---
# Déploie la stack de supervision (Prometheus + node-exporter + Loki + Alloy + Grafana)

# Alloy lit le journal systemd dans /var/log/journal : le journal doit y être
# conservé (c'est le cas d'origine sur Debian/Ubuntu ; sur Fedora/RHEL, il
# reste en mémoire dans /run/log/journal tant que ce dossier n'existe pas).
- name: Créer le dossier du journal persistant
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Basculer le journal sur le disque

# Avant le démarrage d'Alloy, qui doit trouver le journal à sa place
- name: Appliquer la bascule du journal
  ansible.builtin.meta: flush_handlers

- name: Copier les fichiers de la supervision
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../supervision/"
    dest: "{{ lab_dacs_dir }}/supervision/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Générer le fichier .env (utilisateur Grafana, nom d'hôte)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ lab_dacs_dir }}/supervision/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# Le mot de passe n'est PAS dans .env : Docker Compose y coupe la valeur à « # »
# et interprète « $ ». Grafana le lit dans un fichier monté (GF_..._PASSWORD__FILE),
# octet pour octet. Propriétaire 472 : l'utilisateur du conteneur Grafana.
- name: Écrire le mot de passe admin Grafana (depuis Vault)
  ansible.builtin.copy:
    content: "{{ grafana_admin_password }}"
    dest: "{{ lab_dacs_dir }}/supervision/grafana_admin_password"
    owner: "472"
    group: "0"
    mode: "0400"
  no_log: true

- name: Démarrer la stack avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ lab_dacs_dir }}/supervision"
    state: present
  become: true
