---
# Installe les scripts d'alerte et leurs timers systemd
- name: Installer les outils utilises par les alertes (curl, jq)
  # RHEL 9 et dérivés fournissent curl-minimal, en conflit avec le paquet curl
  # complet : avec dnf, on demande le fichier /usr/bin/curl, que l'un ou l'autre fournit.
  ansible.builtin.package:
    name:
      - "{{ '/usr/bin/curl' if ansible_facts['pkg_mgr'] in ['dnf', 'dnf5'] else 'curl' }}"
      - jq
    state: present

- name: Installer les scripts d'alerte
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../alertes/scripts/{{ item }}"
    dest: /usr/local/bin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop:
    - alerte-connexion.sh
    - alerte-sudo.sh
    - alerte-crowdsec.sh
    - alerte-adguard.sh

- name: Installer les services et timers systemd
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../alertes/systemd/{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - alerte-crowdsec.service
    - alerte-crowdsec.timer
    - alerte-adguard.service
    - alerte-adguard.timer

- name: Recharger systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Activer et démarrer les timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - alerte-crowdsec.timer
    - alerte-adguard.timer

# /etc/pam.d/sshd et /etc/pam.d/sudo existent sous ce nom sur Debian comme sur Fedora/RHEL
- name: Brancher l'alerte de connexion SSH sur PAM
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    line: "session optional pam_exec.so /usr/local/bin/alerte-connexion.sh"

- name: Brancher l'alerte sudo sur PAM
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo
    line: "session optional pam_exec.so seteuid /usr/local/bin/alerte-sudo.sh"
