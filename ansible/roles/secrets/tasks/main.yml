---
# Sépare l'identifiant et le mot de passe AdGuard une seule fois pour tous les
# rôles. On découpe sur le PREMIER ':' seulement : le mot de passe peut donc en
# contenir. Si adguard_user / adguard_password sont déjà définis dans le coffre,
# ils sont utilisés tels quels. Résultat : secrets_adguard_user / secrets_adguard_password.
- name: Séparer l'identifiant et le mot de passe AdGuard
  ansible.builtin.set_fact:
    secrets_adguard_user: "{{ adguard_user if adguard_user is defined else adguard_auth.split(':', 1)[0] }}"
    secrets_adguard_password: "{{ adguard_password if adguard_password is defined else adguard_auth.split(':', 1)[1] }}"
  when: >-
    (adguard_user is defined and adguard_password is defined)
    or (adguard_auth is defined and ':' in adguard_auth)
  no_log: true

- name: Vérifier les identifiants AdGuard
  ansible.builtin.assert:
    that:
      - secrets_adguard_user is defined and secrets_adguard_user | string | length > 0
      - secrets_adguard_password is defined and secrets_adguard_password | string | length > 0
    fail_msg: "adguard_auth doit être de la forme identifiant:mot_de_passe (ou définir adguard_user et adguard_password)."
    quiet: true
  no_log: true

# Génère /etc/lab-alertes.conf à partir des secrets du coffre Vault
- name: Déployer le fichier de secrets des alertes
  ansible.builtin.template:
    src: lab-alertes.conf.j2
    dest: /etc/lab-alertes.conf
    owner: root
    group: root
    mode: "0600"
