---
# Pare-feu : tout refuser en entrée, sauf SSH et DNS (AdGuard).
#   - Debian, Ubuntu : ufw
#   - Fedora, Rocky, Alma : firewalld (pare-feu natif, déjà présent en général)
- name: Pare-feu ufw (Debian, Ubuntu)
  ansible.builtin.include_tasks: ufw.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Pare-feu firewalld (Fedora, RHEL)
  ansible.builtin.include_tasks: firewalld.yml
  when: ansible_facts['os_family'] == 'RedHat'
