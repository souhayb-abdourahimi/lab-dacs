---
# Le plugin Compose v2 ne porte pas le même nom de paquet selon la version :
#   - Ubuntu 22.04 / 24.04 : docker-compose-v2 (le paquet docker-compose y est l'ancien v1)
#   - Debian 13            : docker-compose (déjà en v2)
#   - Debian 12            : aucun paquet v2 -> binaire officiel (tasks/main.yml)
- name: Installer Docker
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Choisir le paquet du plugin Compose v2 pour cette distribution
  ansible.builtin.set_fact:
    docker_compose_paquet: >-
      {{ 'docker-compose-v2' if ansible_facts['distribution'] == 'Ubuntu'
         else ('docker-compose' if ansible_facts['distribution'] == 'Debian'
               and ansible_facts['distribution_major_version'] | int >= 13
               else '') }}

- name: Installer le plugin Compose v2 depuis la distribution
  ansible.builtin.apt:
    name: "{{ docker_compose_paquet }}"
    state: present
  when: docker_compose_paquet | length > 0
