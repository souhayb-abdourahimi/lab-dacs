---
# Installe Docker et le plugin « docker compose » v2, requis par
# community.docker.docker_compose_v2. Source selon la distribution :
#   - Debian 12/13, Ubuntu : docker.io de la distribution      (tasks/debian.yml)
#   - Fedora               : moby-engine de la distribution    (tasks/fedora.yml)
#   - Rocky, Alma, RHEL 9  : Docker CE, dépôt officiel Docker  (tasks/el.yml)
# Le plugin Compose v2 est ensuite vérifié ; à défaut (Debian 12 notamment),
# le binaire officiel est installé avec une empreinte vérifiée.
- name: Installer Docker (Debian, Ubuntu)
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Installer Docker (Fedora)
  ansible.builtin.include_tasks: fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: Installer Docker CE (Rocky, Alma, RHEL)
  ansible.builtin.include_tasks: el.yml
  when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Fedora'

- name: Vérifier la présence de « docker compose » v2
  ansible.builtin.command: docker compose version --short
  register: docker_compose_v2
  changed_when: false
  failed_when: false

# Secours (Debian 12, ou paquet absent/trop ancien) : binaire officiel dans le
# dossier des plugins de la CLI Docker, empreinte SHA-256 vérifiée au téléchargement.
- name: Installer le plugin Compose v2 officiel (secours)
  when: >-
    docker_compose_v2.rc != 0
    or not (docker_compose_v2.stdout | trim | regex_replace('^v', '')) is version('2.18.0', '>=')
  block:
    - name: Vérifier que l'architecture est prise en charge
      ansible.builtin.assert:
        that: ansible_facts['architecture'] in docker_compose_sha256
        fail_msg: >-
          Architecture {{ ansible_facts['architecture'] }} non prise en charge pour le
          plugin Compose de secours : installez « docker compose » v2 manuellement.

    - name: Créer le dossier des plugins de la CLI Docker
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Télécharger le plugin Compose v2
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-{{ ansible_facts['architecture'] }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        checksum: "sha256:{{ docker_compose_sha256[ansible_facts['architecture']] }}"
        owner: root
        group: root
        mode: "0755"

    - name: Vérifier « docker compose » après installation
      ansible.builtin.command: docker compose version
      changed_when: false

- name: Démarrer et activer Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur au groupe docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
