---
# Déploie le filtre DNS AdGuard Home, préconfiguré (mot de passe + listes)
- name: Créer les dossiers AdGuard
  ansible.builtin.file:
    path: "{{ lab_dacs_dir }}/adguard/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - ""
    - conf
    - work

- name: Copier le docker-compose d'AdGuard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../adguard/docker-compose.yml"
    dest: "{{ lab_dacs_dir }}/adguard/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Générer le fichier .env d'AdGuard (nom d'hôte du serveur)
  ansible.builtin.copy:
    content: "NODE_HOSTNAME={{ ansible_facts['hostname'] }}\n"
    dest: "{{ lab_dacs_dir }}/adguard/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# Hash bcrypt du mot de passe AdGuard (adguard_password, préparé par le rôle secrets),
# calculé avec htpasswd -B comme le recommande la documentation d'AdGuard Home.
# htpasswd est dans les dépôts de base partout (python3-bcrypt ne l'est pas sur RHEL 9).
- name: Installer htpasswd (pour hacher le mot de passe AdGuard)
  ansible.builtin.package:
    name: "{{ 'apache2-utils' if ansible_facts['os_family'] == 'Debian' else 'httpd-tools' }}"
    state: present

# Le mot de passe passe par l'entrée standard (-i) : il n'apparaît pas dans la
# ligne de commande (ps), et aucun caractère ne peut casser la commande.
# Sortie « identifiant:hash » : on garde ce qui suit le premier ':'.
- name: Générer le hash bcrypt du mot de passe AdGuard
  ansible.builtin.command:
    argv: [htpasswd, -n, -i, -B, -C, "10", "{{ adguard_user }}"]
    stdin: "{{ adguard_password }}"
    stdin_add_newline: false
  register: adguard_hash
  changed_when: false
  no_log: true

- name: Déployer la configuration AdGuard préremplie (depuis Vault)
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ lab_dacs_dir }}/adguard/conf/AdGuardHome.yaml"
    owner: root
    group: root
    mode: "0600"
  vars:
    adguard_password_hash: "{{ adguard_hash.stdout | trim | regex_replace('^[^:]*:', '') }}"
  become: true

- name: Démarrer AdGuard avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ lab_dacs_dir }}/adguard"
    state: present
  become: true
