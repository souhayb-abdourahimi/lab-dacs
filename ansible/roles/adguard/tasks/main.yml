---
# Déploie le filtre DNS AdGuard Home, préconfiguré (mot de passe + listes)
- name: Créer les dossiers AdGuard
  ansible.builtin.file:
    path: "{{ lab_dacs_dir }}/adguard/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - ""
    - conf
    - work

- name: Copier le docker-compose d'AdGuard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../adguard/docker-compose.yml"
    dest: "{{ lab_dacs_dir }}/adguard/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Générer le fichier .env d'AdGuard (nom d'hôte du serveur)
  ansible.builtin.copy:
    content: "NODE_HOSTNAME={{ ansible_facts['hostname'] }}\n"
    dest: "{{ lab_dacs_dir }}/adguard/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# Génère le hash bcrypt du mot de passe AdGuard (adguard_password, préparé par le rôle secrets)
- name: Installer python3-bcrypt (pour hacher le mot de passe AdGuard)
  ansible.builtin.apt:
    name: python3-bcrypt
    state: present
    update_cache: true

# Le mot de passe passe par l'entrée standard : il n'apparaît ni dans le code
# Python ni dans la ligne de commande (ps), et aucun caractère ne peut casser la commande.
- name: Générer le hash bcrypt du mot de passe AdGuard
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import sys, bcrypt; print(bcrypt.hashpw(sys.stdin.buffer.read(), bcrypt.gensalt()).decode())"
    stdin: "{{ adguard_password }}"
    stdin_add_newline: false
  register: adguard_hash
  changed_when: false
  no_log: true

- name: Déployer la configuration AdGuard préremplie (depuis Vault)
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ lab_dacs_dir }}/adguard/conf/AdGuardHome.yaml"
    owner: root
    group: root
    mode: "0600"
  vars:
    adguard_password_hash: "{{ adguard_hash.stdout }}"
  become: true

- name: Démarrer AdGuard avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ lab_dacs_dir }}/adguard"
    state: present
  become: true
