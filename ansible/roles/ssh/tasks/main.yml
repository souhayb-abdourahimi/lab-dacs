---
# Durcissement SSH : clé uniquement, root interdit.
# Fichier préfixé 00- : sshd retient la PREMIÈRE valeur lue, il l'emporte donc sur
# les réglages des distributions (ex. 50-redhat.conf sur Fedora/RHEL, 50-cloud-init.conf).
- name: Déployer la configuration SSH durcie
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-durcissement.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible - durcissement SSH
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  notify: Redémarrer SSH
