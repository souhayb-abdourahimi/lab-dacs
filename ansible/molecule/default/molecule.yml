---
# Test du playbook site.yml dans un conteneur systemd (driver Docker).
# La distribution est choisie par variables d'environnement (voir le Makefile
# et .github/workflows/molecule.yml) :
#   MOLECULE_DISTRO=debian12 MOLECULE_IMAGE=geerlingguy/docker-debian12-ansible:latest
# Le conteneur est privilégié : il fait tourner systemd ET un démon Docker
# (les stacks supervision/AdGuard du lab), comme une vraie VM.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
driver:
  name: docker
platforms:
  - name: lab-${MOLECULE_DISTRO:-debian12}
    image: ${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Données du Docker interne sur des volumes : overlayfs ne s'empile pas sur
      # overlayfs (Docker >= 27 stocke ses images via containerd)
      - /var/lib/docker
      - /var/lib/containerd
    groups:
      - serveurs
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: ${MOLECULE_PROJECT_DIRECTORY}/site.yml
    verify: verify.yml
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      serveurs:
        ansible_user: root
        # Désactive ce qui ne peut pas tourner en conteneur : pare-feu, redémarrage de sshd
        lab_test_conteneur: true
        # Secrets de test (en production : coffre Ansible Vault créé par install.sh).
        # Mot de passe AdGuard volontairement « piégé » : ' : # " et espaces.
        grafana_admin_password: "grafana-ci-mdp"
        ntfy_topic: "lab-dacs-ci-molecule"
        adguard_auth: "admin:mot de passe: #piégé' \"ci"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
