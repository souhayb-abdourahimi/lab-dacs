---
# Prépare le conteneur comme une VM fraîchement installée : serveur SSH (avec
# ses clés d'hôte, nécessaires à sshd -t / sshd -T) et sudo.
- name: Préparer le conteneur de test
  hosts: all
  gather_facts: true
  tasks:
    - name: Installer le serveur SSH et sudo
      ansible.builtin.package:
        name:
          - openssh-server
          - sudo
        state: present
        update_cache: "{{ ansible_facts['os_family'] == 'Debian' }}"

    - name: Générer les clés d'hôte SSH
      ansible.builtin.command: ssh-keygen -A
      changed_when: false

    # Sur une vraie machine, systemd monte / en « shared » ; dans un conteneur
    # il est privé, et node-exporter (montage /:/host:rslave) refuserait de démarrer.
    - name: Rendre / partagé, comme sur un hôte systemd
      # (le module mount ne gère pas la propagation des montages)
      ansible.builtin.command: mount --make-rshared /  # noqa: command-instead-of-module
      changed_when: false
