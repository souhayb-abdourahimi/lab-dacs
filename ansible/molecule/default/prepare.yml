---
# Prépare le conteneur comme une VM fraîchement installée : serveur SSH (avec
# ses clés d'hôte, nécessaires à sshd -t / sshd -T) et sudo.
- name: Préparer le conteneur de test
  hosts: all
  gather_facts: true
  tasks:
    - name: Installer le serveur SSH et sudo
      ansible.builtin.package:
        name:
          - openssh-server
          - sudo
        state: present
        update_cache: "{{ ansible_facts['os_family'] == 'Debian' }}"

    - name: Générer les clés d'hôte SSH
      ansible.builtin.command: ssh-keygen -A
      changed_when: false
