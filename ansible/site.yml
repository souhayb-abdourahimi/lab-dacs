---
- name: Déploiement du lab DACS
  hosts: serveurs
  become: true
  gather_facts: false

  pre_tasks:
    - name: S'assurer que Python 3 est installé
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null 2>&1; then
          test -e /usr/bin/python3 || {
            apt-get update
            apt-get install -y python3
          }
        elif command -v dnf >/dev/null 2>&1; then
          paquets="python3 python3-libselinux"
          if dnf --version 2>/dev/null | grep -q dnf5; then
            paquets="$paquets python3-libdnf5"
          fi
          rpm -q $paquets >/dev/null 2>&1 || dnf install -y $paquets
        fi
      changed_when: false

    - name: Collecter les informations sur le serveur
      ansible.builtin.setup:

    - name: Mettre à jour l'index des paquets
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Déterminer le nom du service SSH
      ansible.builtin.set_fact:
        ssh_service: >-
          {{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}

    - name: Lire le compte de l'utilisateur de déploiement
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Définir le dossier de déploiement du lab
      ansible.builtin.set_fact:
        lab_dacs_dir: >-
          {{
            lab_dacs_dir
            | default(
                ansible_facts['getent_passwd'][ansible_user][4]
                ~ '/lab-dacs'
              )
          }}

    - name: Exécuter les contrôles préalables
      ansible.builtin.include_role:
        name: preflight

  roles:
    - role: secrets
      tags: [secrets]
    - role: selinux
      tags: [selinux]
    - role: docker
      tags: [docker]
    - role: supervision
      tags: [supervision]
    - role: adguard
      tags: [adguard]
    - role: alertes
      tags: [alertes]
    - role: parefeu
      tags: [parefeu]
    - role: crowdsec
      tags: [crowdsec]
    - role: ssh
      tags: [ssh]

  post_tasks:
    - name: Exécuter les contrôles post-déploiement
      ansible.builtin.include_role:
        name: postflight
