[defaults]
inventory = inventory/hosts.yml
vault_password_file = .vault_pass
# host_key_checking reste actif (valeur par défaut) : une clé d'hôte qui CHANGE
# fait échouer la connexion (possible attaque de l'homme du milieu).

[ssh_connection]
# accept-new : la clé d'un serveur jamais vu est mémorisée dans ~/.ssh/known_hosts
# à la première connexion (install.sh la fait d'abord confirmer), mais une clé
# différente de celle déjà connue est refusée. Les autres options reprennent les
# valeurs par défaut d'Ansible (compression, connexion SSH réutilisée).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
