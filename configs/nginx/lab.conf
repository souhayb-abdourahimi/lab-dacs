# /etc/nginx/sites-available/lab.conf
#
# Virtual host de demonstration du lab DACS.
# Sert un site statique et fait office de reverse proxy vers une
# application conteneurisee ecoutant sur le port 8000.
#
# Activation :
#   sudo cp configs/nginx/lab.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/lab.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name lab.local;

    root  /var/www/lab;
    index index.html;

    access_log /var/log/nginx/lab-access.log;
    error_log  /var/log/nginx/lab-error.log;

    # En-tetes de securite minimaux
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin"     always;

    # Ne pas divulguer la version du serveur
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy vers l'application conteneurisee
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Bloquer l'acces aux fichiers caches
    location ~ /\. {
        deny all;
    }
}
