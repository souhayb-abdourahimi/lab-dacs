---
# Supervision du lab : Prometheus (collecte) + node-exporter (métriques du serveur)
# + Loki (journaux) + Alloy (envoi du journal systemd à Loki) + Grafana (affichage)
# Versions fixées pour un déploiement reproductible : vérifie les plus récentes sur Docker Hub.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [supervision]
    restart: unless-stopped
    # Aucun port publié : Prometheus n'est joignable que depuis le réseau interne.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    hostname: ${NODE_HOSTNAME:-serveur}
    command:
      - --path.rootfs=/host
    pid: host
    # Lit tout le système de fichiers de l'hôte (en lecture seule) : sous SELinux
    # (Fedora), l'étiquetage du conteneur l'en empêcherait. Sans effet ailleurs.
    security_opt:
      - label=disable
    volumes:
      - /:/host:ro,rslave
    networks: [supervision]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [supervision]
    restart: unless-stopped
    # Aucun port publié : Loki n'est joignable que depuis le réseau interne.

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Lit le journal systemd de l'hôte (lecture seule) : ses fichiers sont
    # réservés à root et au groupe systemd-journal, dont le numéro varie d'une
    # distribution à l'autre, d'où root. Même remarque SELinux que node-exporter.
    user: "0:0"
    security_opt:
      - label=disable
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    networks: [supervision]
    restart: unless-stopped
    # Aucun port publié (l'interface d'Alloy reste interne).

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    env_file: .env
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      # Mot de passe lu dans un fichier : aucun caractère n'est interprété
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    ports:
      # Lié à 127.0.0.1 : jamais exposé sur le réseau, accès par tunnel SSH uniquement.
      # (Docker contourne ufw pour les ports publiés, d'où ce choix.)
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_admin_password:/run/secrets/grafana_admin_password:ro
    depends_on: [prometheus, loki]
    networks: [supervision]
    restart: unless-stopped

networks:
  supervision: {}

volumes:
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
  alloy-data: {}
